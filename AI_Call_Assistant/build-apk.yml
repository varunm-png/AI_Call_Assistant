name: Build Debug APK

# Builds an installable debug APK automatically on GitHub's own servers —
# no local Android Studio / SDK / Gradle install needed on your machine.
#
# HOW TO USE:
#   1. Push this whole project to a GitHub repository (public or private).
#   2. That push automatically triggers this workflow (or run it manually:
#      GitHub repo -> Actions tab -> "Build Debug APK" -> "Run workflow").
#   3. Wait ~3-5 minutes for it to finish (green checkmark).
#   4. Open the finished run -> scroll to "Artifacts" -> download
#      "app-debug-apk" -> unzip it -> you have app-debug.apk.
#
# Tagging a commit like "v1.0.0" also publishes the APK as a GitHub Release,
# giving you a stable, permanent download link.

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-app

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Generate Gradle wrapper
        run: gradle wrapper --gradle-version 8.9

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: android-app/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Attach APK to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: android-app/app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
